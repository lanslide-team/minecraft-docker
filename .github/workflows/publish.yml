
name: Build & Publish Minecraft Images

on:
  push:
    branches:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: lanslide-team
  BASE_NAME: minecraft-base
  BEDWARS_NAME: minecraft-bedwars
  BUILD_NAME: minecraft-build
  MAP_NAME: minecraft-map

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "mc_version=${BRANCH#v}" >> "$GITHUB_OUTPUT"
          echo "Minecraft version: ${BRANCH#v}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # Base image - always download latest Paper build
      # --------------------------------------------------
      - name: Build & Push Base image
        uses: docker/build-push-action@v6
        with:
          context: ./base
          push: true
          no-cache-filters: |
            build
          build-args: |
            MC_VERSION=${{ steps.version.outputs.mc_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BASE_NAME }}:${{ steps.version.outputs.branch }}
          labels: |
            org.opencontainers.image.title=Minecraft Base
            org.opencontainers.image.version=${{ steps.version.outputs.mc_version }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # --------------------------------------------------
      # BedWars variant
      # --------------------------------------------------
      - name: Build & Push BedWars variant
        uses: docker/build-push-action@v6
        with:
          context: ./bedwars
          push: true
          pull: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BEDWARS_NAME }}:${{ steps.version.outputs.branch }}
          build-args: |
            BASE_TAG=${{ steps.version.outputs.branch }}
          labels: |
            org.opencontainers.image.title=Minecraft BedWars
            org.opencontainers.image.version=${{ steps.version.outputs.mc_version }}
          cache-from: type=gha,scope=bedwars
          cache-to: type=gha,mode=max,scope=bedwars

      # --------------------------------------------------
      # Build variant
      # --------------------------------------------------
      - name: Build & Push Build variant
        uses: docker/build-push-action@v6
        with:
          context: ./build
          push: true
          pull: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BUILD_NAME }}:${{ steps.version.outputs.branch }}
          build-args: |
            BASE_TAG=${{ steps.version.outputs.branch }}
          labels: |
            org.opencontainers.image.title=Minecraft Build
            org.opencontainers.image.version=${{ steps.version.outputs.mc_version }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

      # --------------------------------------------------
      # Map variant
      # --------------------------------------------------
      - name: Build & Push Map variant
        uses: docker/build-push-action@v6
        with:
          context: ./map
          push: true
          pull: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.MAP_NAME }}:${{ steps.version.outputs.branch }}
          build-args: |
            BASE_TAG=${{ steps.version.outputs.branch }}
          labels: |
            org.opencontainers.image.title=Minecraft Map
            org.opencontainers.image.version=${{ steps.version.outputs.mc_version }}
          cache-from: type=gha,scope=map
          cache-to: type=gha,mode=max,scope=map
